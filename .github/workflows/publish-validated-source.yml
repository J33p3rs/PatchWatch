name: Patch Watch - Publish Validated Source

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patchwatch-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: patchwatch-production

    steps:
      - name: Validate GitHub App configuration
        shell: bash
        env:
          SOURCE_CLIENT_ID: ${{ vars.PATCHWATCH_SOURCE_READER_CLIENT_ID }}
          SOURCE_PRIVATE_KEY: ${{ secrets.PATCHWATCH_SOURCE_READER_PRIVATE_KEY }}
          PUBLISHER_CLIENT_ID: ${{ vars.PATCHWATCH_PUBLISHER_CLIENT_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PATCHWATCH_PUBLISHER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SOURCE_CLIENT_ID SOURCE_PRIVATE_KEY PUBLISHER_CLIENT_ID PUBLISHER_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub App configuration: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PATCHWATCH_SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.PATCHWATCH_SOURCE_READER_PRIVATE_KEY }}
          owner: J33p3rs
          repositories: ai-learning-challenge
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-vulnerability-alerts: read

      - name: Resolve exact successful private main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          source_sha="$(
            gh api \
              '/repos/J33p3rs/ai-learning-challenge/actions/workflows/patchwatch-security.yml/runs?branch=main&status=success&per_page=1' \
              --jq '.workflow_runs[0].head_sha // empty'
          )"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve latest successful Patch Watch source SHA."; exit 1; }
          main_sha="$(gh api '/repos/J33p3rs/ai-learning-challenge/commits/main' --jq '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve private main SHA."; exit 1; }
          if [[ "$source_sha" != "$main_sha" ]]; then
            echo "Latest successful Patch Watch source is not current private main; waiting for exact-main security validation."
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Block High/Critical Dependabot alerts
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          EXPECTED_MAIN_SHA: ${{ steps.source.outputs.main_sha }}
        run: |
          set -euo pipefail
          before_sha="$(gh api '/repos/J33p3rs/ai-learning-challenge/commits/main' --jq '.sha')"
          [[ "$before_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "Private main advanced before the Dependabot scan; refusing a stale dependency decision."
            exit 1
          }
          gh api --paginate \
            '/repos/J33p3rs/ai-learning-challenge/dependabot/alerts?state=open&per_page=100' \
            --jq '.[]' | jq -s '[.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")]' > dependabot-blockers.json
          after_sha="$(gh api '/repos/J33p3rs/ai-learning-challenge/commits/main' --jq '.sha')"
          [[ "$after_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "Private main advanced during the Dependabot scan; refusing an unbound dependency decision."
            exit 1
          }
          blocker_count="$(jq 'length' dependabot-blockers.json)"
          if (( blocker_count > 0 )); then
            echo "Open High/Critical Dependabot alerts block PatchWatch publication: ${blocker_count}"
            jq -r '.[] | "- alert #\(.number): \(.dependency.package.name) [\(.security_advisory.severity)] \(.security_advisory.ghsa_id)"' dependabot-blockers.json
            exit 1
          fi

      - name: Check out validated private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: J33p3rs/ai-learning-challenge
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Check out public repository read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: J33p3rs/PatchWatch
          ref: main
          token: ${{ github.token }}
          path: public-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Verify installed security-workflow trust state
        shell: bash
        run: |
          set -euo pipefail
          state_file='public-repo/.github/trusted-security-workflow-blob'
          [[ -f "$state_file" ]] || { echo "Missing public security-workflow trust state."; exit 1; }
          trusted_blob="$(tr -d '\r\n' < "$state_file")"
          candidate_blob="$(git -C source rev-parse 'HEAD:.github/workflows/patchwatch-security.yml')"
          [[ "$trusted_blob" =~ ^[0-9a-f]{40}$ && "$candidate_blob" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid security-workflow trust state."; exit 1;
          }
          [[ "$candidate_blob" == "$trusted_blob" ]] || {
            echo "Private security workflow has not yet been promoted through the trusted controller sync."
            echo "Trusted:   $trusted_blob"
            echo "Candidate: $candidate_blob"
            exit 1
          }

      - name: Check exact canonical controller GitHub Action advisories
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          # Use the already-installed public scanner as the trust root. Candidate scanner
          # changes cannot approve their own Action dependency set.
          python public-repo/.github/scripts/check-patchwatch-action-advisories.py \
            source/PatchWatch/public-controller

      - name: Verify forward-only source and classify changes
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          current_message="$(git -C public-repo log --format=%s | grep -m1 -E '^Publish Patch Watch from [0-9a-f]{40}$' || true)"
          if [[ ! "$current_message" =~ ^Publish\ Patch\ Watch\ from\ ([0-9a-f]{40})$ ]]; then
            echo "No recognised publication source marker exists in public history."
            exit 1
          fi
          current_source="${BASH_REMATCH[1]}"
          compare_json="$(gh api "/repos/J33p3rs/ai-learning-challenge/compare/${current_source}...${SOURCE_SHA}")"
          status="$(jq -r '.status' <<<"$compare_json")"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Candidate would not move forward from current published source (status: $status)."
            exit 1
          fi
          changed_file_count="$(jq '.files | length' <<<"$compare_json")"
          if (( changed_file_count >= 300 )); then
            echo "Compare API returned ${changed_file_count} changed files, at or above GitHub's 300-file cap."
            exit 1
          fi
          jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare_json" | sed '/^$/d' > changed-files.txt

          review_required=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if [[ "$path" =~ ^PatchWatch/data/[^/]+\.json$ ]] || \
               [[ "$path" =~ ^PatchWatch/generated/notes/[0-9]{4}-[0-9]{2}-facts\.json$ ]] || \
               [[ "$path" =~ ^PatchWatch/notes/[0-9]{4}/[0-9]{4}-[0-9]{2}\.md$ ]]; then
              continue
            fi
            if [[ "$path" == PatchWatch/* || "$path" =~ ^\.github/workflows/patchwatch-.*\.yml$ ]]; then
              review_required=true
              echo "Codex review required due to: $path"
            fi
          done < changed-files.txt
          echo "current_source=$current_source" >> "$GITHUB_OUTPUT"
          echo "review_required=$review_required" >> "$GITHUB_OUTPUT"

      - name: Require clean exact-source Codex review for substantive changes
        if: steps.gate.outputs.review_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CURRENT_SOURCE: ${{ steps.gate.outputs.current_source }}
        run: |
          set -euo pipefail
          release_pr="$(
            gh api --paginate '/repos/J33p3rs/ai-learning-challenge/pulls?state=open&per_page=100' \
              --jq ".[] | select(((.head.ref == \"patchwatch-release-review\") or (.head.ref | startswith(\"patchwatch-release-review-\"))) and .head.sha == \"${SOURCE_SHA}\" and .base.sha == \"${CURRENT_SOURCE}\") | .number" |
              head -n 1
          )"
          [[ "$release_pr" =~ ^[0-9]+$ ]] || {
            echo "No open Patch Watch release-review PR has exact head ${SOURCE_SHA} and production base ${CURRENT_SOURCE}."
            exit 1
          }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh api --paginate "/repos/J33p3rs/ai-learning-challenge/pulls/${release_pr}/reviews?per_page=100" --jq '.[]' | jq -s '.' > "$tmp/reviews.json"
          gh api --paginate "/repos/J33p3rs/ai-learning-challenge/issues/${release_pr}/comments?per_page=100" --jq '.[]' | jq -s '.' > "$tmp/comments.json"
          gh api graphql \
            -f query='query($number:Int!){repository(owner:"J33p3rs",name:"ai-learning-challenge"){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:100){nodes{author{login} body} pageInfo{hasNextPage}}} pageInfo{hasNextPage}}}}}' \
            -F number="$release_pr" > "$tmp/threads.json"
          if [[ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' "$tmp/threads.json")" == "true" ]] || \
             [[ "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[].comments.pageInfo.hasNextPage] | any' "$tmp/threads.json")" == "true" ]]; then
            echo "Release review threads exceed safe evaluation bounds."
            exit 1
          fi
          review_result="$(python public-repo/.github/scripts/evaluate_codex_review.py \
            --sha "$SOURCE_SHA" \
            --reviews "$tmp/reviews.json" \
            --threads "$tmp/threads.json" \
            --comments "$tmp/comments.json")"
          if [[ "$(jq -r '.state' <<<"$review_result")" != "clean" ]]; then
            echo "Substantive Patch Watch changes require clean exact-source Codex review evidence tied to ${SOURCE_SHA}."
            echo "$review_result"
            exit 1
          fi

      - name: Verify committed Monthly Notes match source data
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python PatchWatch/scripts/build_notes_index.py --backfill --latest
          stale="$(git status --porcelain -- PatchWatch/data/notes.json PatchWatch/generated/notes PatchWatch/notes)"
          if [[ -n "$stale" ]]; then
            echo "Monthly Notes are missing or stale for this validated source; refusing publication."
            echo "$stale"
            exit 1
          fi

      - name: Build and verify allow-listed public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/data
          for path in \
            index.html nvd.html kev.html notes.html \
            app.js nvd.js kev.js notes.js chart-scroll.js bar-selection.js \
            style.css trend.css bar-selection.css notes.css \
            data/patches.json data/fortinet.json data/ios.json data/macos.json \
            data/chrome.json data/firefox.json data/nvd.json data/kev.json data/linux-kernel.json data/notes.json; do
            mkdir -p "publish/$(dirname "$path")"
            cp "source/PatchWatch/$path" "publish/$path"
          done
          cp source/PatchWatch/PUBLIC-README.md publish/README.md
          cp source/PatchWatch/LICENSE publish/LICENSE

          cat > expected-site-files.txt <<'EOF'
          LICENSE
          README.md
          app.js
          bar-selection.css
          bar-selection.js
          chart-scroll.js
          data/chrome.json
          data/firefox.json
          data/fortinet.json
          data/ios.json
          data/kev.json
          data/linux-kernel.json
          data/macos.json
          data/notes.json
          data/nvd.json
          data/patches.json
          index.html
          kev.html
          kev.js
          notes.css
          notes.html
          notes.js
          nvd.html
          nvd.js
          style.css
          trend.css
          EOF
          find publish -type f -printf '%P\n' | sort > actual-site-files.txt
          sort -o expected-site-files.txt expected-site-files.txt
          diff -u expected-site-files.txt actual-site-files.txt

      - name: Verify current public site-file boundary
        shell: bash
        run: |
          set -euo pipefail
          git -C public-repo ls-files -s | while read -r mode object stage path; do
            [[ "$path" == .github/* ]] && continue
            if [[ "$mode" != "100644" && "$mode" != "100755" ]]; then
              echo "Unexpected non-regular tracked entry: mode=$mode path=$path"
              exit 1
            fi
            echo "$path"
          done | sort > current-site-files.txt
          unexpected="$(comm -23 current-site-files.txt expected-site-files.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected public site tracked entry/entries:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create public-repository publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PATCHWATCH_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PATCHWATCH_PUBLISHER_PRIVATE_KEY }}
          owner: J33p3rs
          repositories: PatchWatch
          permission-contents: write

      - name: Configure Publisher App remote credentials
        shell: bash
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          git -C public-repo remote set-url origin "https://x-access-token:${PUBLISHER_TOKEN}@github.com/J33p3rs/PatchWatch.git"

      - name: Promote validated site files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            mkdir -p "public-repo/$(dirname "$path")"
            cp "publish/$path" "public-repo/$path"
            git -C public-repo add -N -- "$path"
          done < expected-site-files.txt

          git -C public-repo ls-files -s | while read -r mode object stage path; do
            [[ "$path" == .github/* ]] && continue
            if [[ "$mode" != "100644" && "$mode" != "100755" ]]; then
              echo "Unexpected non-regular tracked entry after promotion: mode=$mode path=$path"
              exit 1
            fi
            echo "$path"
          done | sort > promoted-site-files.txt
          diff -u expected-site-files.txt promoted-site-files.txt

      - name: Configure Publisher App commit identity
        id: publisher-identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq '.id')"
          [[ "$bot_id" =~ ^[0-9]+$ ]] || { echo "Could not resolve Publisher App bot ID."; exit 1; }
          echo "name=$bot_login" >> "$GITHUB_OUTPUT"
          echo "email=${bot_id}+${bot_login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit and push validated public update
        shell: bash
        working-directory: public-repo
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BOT_NAME: ${{ steps.publisher-identity.outputs.name }}
          BOT_EMAIL: ${{ steps.publisher-identity.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          while IFS= read -r path; do
            git add -- "$path"
          done < ../expected-site-files.txt
          if git diff --cached --quiet; then
            echo "No allow-listed site changes to publish."
            exit 0
          fi
          git commit -m "Publish Patch Watch from ${SOURCE_SHA}"
          git push origin HEAD:main
