name: Patch Watch - Controller Security

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controller candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate controller Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/*.py

      - name: Require SHA-pinned external actions
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref="${line#*uses: }"
            ref="${ref%% *}"
            case "$ref" in
              ./*|docker://*) continue ;;
            esac
            if [[ ! "$ref" =~ ^[^@[:space:]]+@[0-9a-fA-F]{40}$ ]]; then
              echo "Unpinned external action: $ref"
              bad=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows || true)
          test "$bad" -eq 0

      - name: Validate publisher controller invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/publish-validated-source.yml
          test -f .github/scripts/check-patchwatch-action-advisories.py
          grep -Fq 'permission-vulnerability-alerts: read' .github/workflows/publish-validated-source.yml
          grep -Fq 'Check exact candidate GitHub Action advisories' .github/workflows/publish-validated-source.yml
          grep -Fq 'High/Critical GitHub Action advisories block PatchWatch publication' .github/scripts/check-patchwatch-action-advisories.py
