name: Patch Watch - Controller Reconciler

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: patchwatch-controller-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted controller from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile eligible controller PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PUBLISHER_CLIENT_ID: ${{ vars.PATCHWATCH_PUBLISHER_CLIENT_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PATCHWATCH_PUBLISHER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          repo_name="${REPO##*/}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          set_status() {
            gh api --method POST "/repos/${REPO}/statuses/$1" \
              -f state="$2" \
              -f context='PatchWatch Controller Gate' \
              -f description="$3" >/dev/null
          }

          gh api "/repos/${REPO}/pulls?state=open&base=main&per_page=100" --paginate \
            --jq '.[] | [.number,.head.sha,.base.sha,.head.ref,(.head.repo.full_name // ""),(.draft|tostring)] | @tsv' |
          while IFS=$'\t' read -r pr sha base_sha branch head_repo draft; do
            [[ -n "$pr" && "$draft" == "false" ]] || continue
            [[ "$head_repo" == "$REPO" ]] || continue
            [[ "$branch" == dependency-* || "$branch" == controller-* ]] || continue
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$base_sha" =~ ^[0-9a-f]{40}$ ]] || continue

            gh api "/repos/${REPO}/compare/${base_sha}...${sha}" > "$tmp/compare-${pr}.json"
            merge_base="$(jq -r '.merge_base_commit.sha // empty' "$tmp/compare-${pr}.json")"
            [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] || { set_status "$sha" failure "Could not resolve exact controller merge base"; continue; }

            git fetch --no-tags origin "$merge_base" "$sha"
            git diff --name-status --no-renames "$merge_base" "$sha" > "$tmp/files-${pr}.txt"
            [[ -s "$tmp/files-${pr}.txt" ]] || { set_status "$sha" failure "Controller PR has no exact diff"; continue; }

            scope_ok=true
            while IFS=$'\t' read -r status path extra; do
              [[ "$status" == "M" || "$status" == "A" ]] || { scope_ok=false; continue; }
              [[ -z "${extra:-}" ]] || { scope_ok=false; continue; }
              case "$path" in
                .github/workflows/*.yml|.github/workflows/*.yaml|.github/scripts/*.py) ;;
                *) scope_ok=false ;;
              esac
            done < "$tmp/files-${pr}.txt"
            if [[ "$scope_ok" != "true" ]]; then
              set_status "$sha" failure "Controller PR exceeds unattended path scope"
              continue
            fi

            gh api --paginate "/repos/${REPO}/actions/workflows/controller-security.yml/runs?event=pull_request&per_page=100" --jq '.workflow_runs[]' | jq -s '.' > "$tmp/security-${pr}.json"
            latest_security="$(jq -c --arg sha "$sha" --argjson pr "$pr" --arg base "$base_sha" '[.[] | select(.head_sha == $sha) | select(any(.pull_requests[]?; .number == $pr and .base.sha == $base))] | sort_by(.created_at) | reverse | .[0] // empty' "$tmp/security-${pr}.json")"
            if [[ -z "$latest_security" ]]; then
              set_status "$sha" pending "Waiting for exact controller security checks"
              continue
            fi
            if [[ "$(jq -r '.status' <<<"$latest_security")" != "completed" || "$(jq -r '.conclusion' <<<"$latest_security")" != "success" ]]; then
              set_status "$sha" failure "Controller security checks are not successful"
              continue
            fi

            gh api "/repos/${REPO}/pulls/${pr}/reviews?per_page=100" > "$tmp/reviews-${pr}.json"
            gh api "/repos/${REPO}/issues/${pr}/comments?per_page=100" > "$tmp/comments-${pr}.json"
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:100){nodes{author{login} body} pageInfo{hasNextPage}}} pageInfo{hasNextPage}}}}}' \
              -f owner="$owner" -f repo="$repo_name" -F number="$pr" > "$tmp/threads-${pr}.json"

            if [[ ! -f .github/scripts/evaluate_codex_review.py ]]; then
              set_status "$sha" pending "Trusted controller evaluator not yet present on main"
              continue
            fi

            result="$(python .github/scripts/evaluate_codex_review.py --sha "$sha" --reviews "$tmp/reviews-${pr}.json" --threads "$tmp/threads-${pr}.json" --comments "$tmp/comments-${pr}.json")"
            state="$(jq -r '.state' <<<"$result")"
            case "$state" in
              pending)
                set_status "$sha" pending "Waiting for exact-SHA Codex controller review"
                continue
                ;;
              blocked)
                set_status "$sha" failure "Active Codex P0/P1/P2 controller finding"
                continue
                ;;
              clean) ;;
              *) set_status "$sha" failure "Invalid controller review state"; continue ;;
            esac

            current="$(gh api "/repos/${REPO}/pulls/${pr}")"
            current_state="$(jq -r '.state' <<<"$current")"
            current_draft="$(jq -r '.draft' <<<"$current")"
            current_head="$(jq -r '.head.sha' <<<"$current")"
            current_base="$(jq -r '.base.sha' <<<"$current")"
            current_base_ref="$(jq -r '.base.ref' <<<"$current")"
            current_head_ref="$(jq -r '.head.ref' <<<"$current")"
            current_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$current")"
            if [[ "$current_state" != "open" || "$current_draft" != "false" || \
                  "$current_head" != "$sha" || "$current_base" != "$base_sha" || \
                  "$current_base_ref" != "main" || "$current_head_ref" != "$branch" || \
                  "$current_head_repo" != "$REPO" ]]; then
              set_status "$sha" pending "Controller PR changed; revalidating exact context"
              continue
            fi

            set_status "$sha" success "Controller security and Codex gates are clean"

            # Bootstrap-safe: until this workflow/evaluator is on trusted main, no merge is attempted.
            if [[ ! -f .github/workflows/controller-reconciler.yml ]]; then
              continue
            fi

            # Publisher App is the only identity permitted to bypass the public main ruleset.
            token_json="$(python - <<'PY'
import base64, json, os, time, urllib.request
from pathlib import Path

client_id=os.environ['PUBLISHER_CLIENT_ID']
private_key=os.environ['PUBLISHER_PRIVATE_KEY']
print(json.dumps({'client_id_present': bool(client_id), 'private_key_present': bool(private_key)}))
PY
            )"
            if [[ "$(jq -r '.client_id_present and .private_key_present' <<<"$token_json")" != "true" ]]; then
              set_status "$sha" failure "Publisher App configuration unavailable"
              continue
            fi

            echo "Controller PR ${pr} is fully validated. Final Publisher App merge is delegated to the scheduled publisher/controller deployment path."
          done
